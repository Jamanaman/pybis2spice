[project]
name="pybis2spice"
dependencies = [
    "ecdtools",
    "numpy",
    "matplotlib"
    ]
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "Kishan Amratia" },
    { name = "Thomas Damjanovic"}
]
maintainers = [
    { name = "Thomas Damjanovic"}
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
gui=[
    "tkinter-tooltip"
    ]
build=["pyinstaller"]
test=["unittest"]

[tool.hatch.version]
path="pybis2spice/version.py"

[tool.mypy]
python_version = "3.14"

[tool.pyright]
reportOptionalSubscript = "information"
reportAssignmentType = "information"
reportArgumentType = "information"
reportGeneralTypeIssues = "information"
reportCallIssue = "information"