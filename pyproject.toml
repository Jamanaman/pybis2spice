[project]
name="pybis2spice"
dependencies = [
    "ecdtools",
    "numpy",
    "matplotlib"
    ]
requires-python = ">=3.7"
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "Kishan Amratia" },
    { name = "Thomas Damjanovic"}
]
maintainers = [
    { name = "Thomas Damjanovic"}
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
gui=[
    "tkinter-tooltip"
    ]
build=["pyinstaller"]

[tool.hatch.version]
path="pybis2spice/pybis2spice/version.py"