[project]
name="pybis2spice"
dependencies = [
    "ecdtools>=0.7.0",
    "numpy",
    "matplotlib",
]
requires-python = ">=3.10"
version="1.3.0rc5"
readme = "README.md"
authors = [
    { name = "Kishan Amratia" },
    { name = "Thomas Damjanovic"}
]
maintainers = [
    { name = "Thomas Damjanovic"}
]

[build-system]
requires = ["uv", "uv_build"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.mypy]
python_version = "3.14"

[tool.pyright]
reportOptionalSubscript = "information"
reportAssignmentType = "information"
reportArgumentType = "information"
reportGeneralTypeIssues = "information"
reportCallIssue = "information"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "tkinter-tooltip>=3.1.2",
]
docs = [
    "pydata-sphinx-theme>=0.19.0",
    "sphinx>=8.1.3",
]
